<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
  <title>GRAciarnia 2026</title>
  <base target="_top">
  <style>
    body {
        font-family: "Almarai", sans-serif;
        margin: 0;
        padding: 0;
        background-color: #fff;
    }

    .header {
      text-align: center;
      padding: 20px;
      background-color: #f2f2f2;
    }

    .search-container {
      text-align: center;
      padding: 20px;
      max-width: 800px;
      /* Zmniejszony dolny margines ze 120px na 40px, bo nie ma już przypiętego paska sponsorów */
      margin: 20px auto 40px auto;
      background-color: #f7f7f7;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    input[type="text"] {
      padding: 10px;
      width: 60%;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    .przycisk {
      align-items: center;
      background-image: linear-gradient(to bottom, #4CAF50, #3e8e41);
      border: none;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      color: #fff;
      cursor: pointer;
      display: inline-flex;
      font-size: 16px;
      height: 40px;
      padding: 0 20px;
      margin-left: 10px;
      transition: all 0.2s;
      vertical-align: middle;
    }

    .przycisk:hover {
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
      transform: translateY(-2px);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }

    th {
      background-color: #4CAF50;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    /* Dla telefonów */
    @media (max-width: 768px) {
      .header img {
        width: 90vw;
      }
    }

    /* Dla komputerów */
    @media (min-width: 769px) {
      .header img {
        width: 600px;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="logo2026.png" alt="Logo">
  </div>

    <p>Wprowadź nazwę gry, której szukasz:</p>
    <input type="text" id="searchTerm" placeholder="np. Catan, Turbo, Wsiąść do Pociągu...">

    <div id="results"></div>
  </div>
